<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Components Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Components Practice</h1>

      <!-- ACCORDION -->
      <h2>Accordion</h2>
      <div class="accordion">
        <div class="item">
          <button class="header">
            What is a component? <span class="icon">+</span>
          </button>
          <div class="panel">
            <p>A reusable piece of UI, like a button or card.</p>
          </div>
        </div>
        <div class="item">
          <button class="header">
            Why use components? <span class="icon">+</span>
          </button>
          <div class="panel">
            <p>They keep design consistent and save time.</p>
          </div>
        </div>
        <div class="item">
          <button class="header">
            What is an accordion? <span class="icon">+</span>
          </button>
          <div class="panel">
            <p>A list where clicking a header shows or hides content.</p>
          </div>
        </div>
      </div>

      <!-- CAROUSEL -->
      <h2>Carousel</h2>
      <div class="carousel">
        <div class="track">
          <div class="slide s1">Slide 1</div>
          <div class="slide s2">Slide 2</div>
          <div class="slide s3">Slide 3</div>
        </div>
        <button class="nav prev">&#10094;</button>
        <button class="nav next">&#10095;</button>
      </div>
    </main>
  </body>
</html>
